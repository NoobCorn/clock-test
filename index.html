<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock & To-Do</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #ffffff;
            --gradient-1: #ffffff;
            --gradient-2: #ffffff;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: all 0.3s ease;
            background: var(--bg-primary);
        }

        body.gradient-on {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            animation: gradientShift 15s ease infinite;
        }

        body.gradient-diagonal {
            background: linear-gradient(45deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        body.gradient-radial {
            background: radial-gradient(circle, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(10deg); }
        }

        body.gradient-movement-off {
            animation: none !important;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .clock-display {
            text-align: center;
            z-index: 10;
        }

        .time {
            font-size: 12vw;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
            margin: 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .date {
            font-size: 1.5vw;
            color: var(--text-secondary);
            margin-top: 2vw;
            letter-spacing: 0.05em;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .controls {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 3vmin;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
        }

        .controls.visible {
            opacity: 1;
        }

        .controls .left-controls,
        .controls .settings-btn {
            pointer-events: none;
        }

        .controls.visible .left-controls,
        .controls.visible .settings-btn {
            pointer-events: auto;
        }

        .left-controls {
            display: flex;
            gap: 10px;
        }

        .settings-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .tasks-btn {
            height: 50px;
            padding: 0 18px 0 14px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .tasks-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .tasks-btn svg {
            flex-shrink: 0;
        }

        .mode-controls {
            position: fixed;
            bottom: 3vmin;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
            transition: opacity 0.3s ease;
        }

        .mode-controls.dimmed {
            opacity: 0.25;
        }

        .mode-btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: rgba(10, 10, 14, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
            padding: 24px;
        }

        .settings-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .settings-header h2 {
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .settings-section {
            margin-bottom: 32px;
        }

        .settings-section h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .settings-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .theme-preview {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .theme-preview:hover {
            transform: scale(1.05);
        }

        .theme-preview.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .font-preview {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 14px;
            text-align: center;
        }

        .font-preview:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .font-preview.active {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            border: none;
            padding: 0;
        }

        .toggle.on {
            background: var(--accent);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s ease;
        }

        .toggle.on::after {
            left: 24px;
        }

        .toggle-label {
            color: var(--text-primary);
            font-size: 14px;
        }

        .select-group {
            margin-bottom: 12px;
        }

        .select-label {
            display: block;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.2);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        /* Timer Display */
        .timer-display {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 1.5vh, 16px);
            z-index: 10;
        }

        .timer-display.active {
            display: flex;
        }

        .timer-ring-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 340px;
            height: 340px;
        }

        .timer-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .ring-bg {
            fill: none;
            stroke: var(--text-secondary);
            opacity: 0.25;
            stroke-width: 2;
        }

        .ring-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            transition: opacity 0.3s ease;
        }

        .timer-units-col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            transition: transform 0.2s ease;
        }

        .timer-units {
            display: flex;
            align-items: center;
            gap: clamp(2px, 0.4vw, 8px);
        }

        .timer-unit {
            display: flex;
            align-items: center;
            gap: clamp(1px, 0.2vw, 4px);
        }

        .unit-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(4px, 0.4vw, 8px);
        }

        .unit-value {
            font-family: inherit;
            font-size: clamp(40px, 7vw, 84px);
            font-weight: 300;
            color: var(--text-primary);
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 2ch;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            padding: 0;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .unit-value::-webkit-outer-spin-button,
        .unit-value::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .unit-value:focus {
            color: var(--accent);
        }

        .unit-label {
            font-size: clamp(11px, 0.9vw, 14px);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .unit-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: clamp(18px, 1.8vw, 24px);
            cursor: pointer;
            width: clamp(26px, 2vw, 34px);
            height: clamp(26px, 2vw, 34px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s ease, color 0.2s ease;
            line-height: 1;
            font-family: inherit;
        }

        .unit-btn:hover:not(:disabled) {
            opacity: 1;
            color: var(--text-primary);
        }

        .unit-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
        }

        .timer-colon {
            display: flex;
            flex-direction: column;
            gap: clamp(3px, 0.4vw, 6px);
            padding-bottom: clamp(12px, 1.2vw, 18px);
        }

        .timer-colon span {
            width: clamp(6px, 0.5vw, 8px);
            height: clamp(6px, 0.5vw, 8px);
            border-radius: 50%;
            background: var(--text-primary);
            opacity: 0.8;
        }

        .timer-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .timer-icon-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s ease, filter 0.2s ease;
        }

        .timer-icon-btn:active {
            transform: scale(0.94);
        }

        .timer-icon-btn.reset {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
        }

        .timer-icon-btn.reset:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .timer-icon-btn.play {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
        }

        .timer-icon-btn.play:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        /* ===== To-Do Panel ===== */
        .todo-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 380px;
            height: 100vh;
            background: rgba(10, 10, 14, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .todo-panel.open {
            transform: translateX(0);
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 24px 20px;
            flex-shrink: 0;
        }

        .todo-header h2 {
            font-size: 22px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .todo-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .todo-close-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .todo-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px;
        }

        .todo-body::-webkit-scrollbar {
            width: 6px;
        }

        .todo-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .todo-section {
            margin-bottom: 22px;
        }

        .todo-section:empty {
            display: none;
        }

        .todo-section-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .todo-section-label.overdue-label {
            color: #fb7185;
        }

        /* Task Card & Drag Styling */
        .task-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 8px;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            user-select: none;
        }

        .task-card:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .task-card.dragging {
            opacity: 0.35;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            transform: scale(0.98);
        }

        .task-card.drag-over {
            border-top: 2px solid #6366f1;
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            padding: 0;
        }

        .task-checkbox svg {
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .task-checkbox.checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .task-checkbox.checked svg {
            opacity: 1;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-size: 14.5px;
            color: #ffffff;
            font-weight: 500;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-card.completed .task-name {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: line-through;
        }

        .task-due {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        .task-due.tier-red { color: #fb7185; }
        .task-due.tier-orange { color: #fbbf24; }
        .task-due.tier-green { color: #34d399; }

        .task-card.completed .task-due {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Hamburger Handle */
        .task-drag-handle {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            cursor: grab;
            transition: color 0.15s ease;
        }

        .task-drag-handle:hover {
            color: rgba(255, 255, 255, 0.75);
        }

        .task-drag-handle:active {
            cursor: grabbing;
        }

        .task-delete-btn {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border: none;
            background: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .task-delete-btn:hover {
            color: #fb7185;
        }

        .todo-footer {
            flex-shrink: 0;
            padding: 18px 24px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .todo-progress-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .todo-progress-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
        }

        .todo-progress-pct {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 600;
        }

        .todo-progress-track {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .todo-progress-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #818cf8, #6366f1);
            transition: width 0.3s ease;
        }

        .add-task-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-task-input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
        }

        .add-task-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .add-task-input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.1);
        }

        .add-task-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #6366f1;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: filter 0.15s ease, transform 0.1s ease;
        }

        .add-task-btn:hover { filter: brightness(1.1); }
        .add-task-btn:active { transform: scale(0.94); }

        @media (max-width: 768px) {
            .settings-panel, .todo-panel {
                max-width: 100%;
                border-top-left-radius: 0;
                border-bottom-left-radius: 0;
            }
            .time { font-size: 18vw; }
            .date { font-size: 4vw; }
            .mode-btn { padding: 8px 16px; font-size: 12px; }
            .tasks-btn span { display: none; }
            .tasks-btn { width: 50px; padding: 0; justify-content: center; }
        }

        /* Font Styles */
        .font-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .font-helvetica { font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif; }
        .font-orbitron { font-family: 'Orbitron', monospace; }
        .font-roboto-mono { font-family: 'Roboto Mono', monospace; }
        .font-space-mono { font-family: 'Space Mono', monospace; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-raleway { font-family: 'Raleway', sans-serif; }
        .font-lora { font-family: 'Lora', serif; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=Raleway:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="font-inter">
    <div class="container">
        <div class="clock-display" id="clockDisplay">
            <p class="time" id="time">00:00:00</p>
            <p class="date" id="date"></p>
        </div>

        <div class="timer-display" id="timerDisplay">
            <div class="timer-ring-wrap">
                <svg class="timer-ring" viewBox="0 0 300 300">
                    <circle class="ring-bg" cx="150" cy="150" r="140"></circle>
                    <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="140"></circle>
                </svg>
                <div class="timer-units-col">
                    <div class="timer-units">
                        <div class="timer-unit">
                            <button class="unit-btn" data-unit="hours" data-dir="-1" aria-label="Decrease hours">&minus;</button>
                            <div class="unit-col">
                                <input class="unit-value" id="hoursInput" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Hours">
                                <span class="unit-label">Hours</span>
                            </div>
                            <button class="unit-btn" data-unit="hours" data-dir="1" aria-label="Increase hours">+</button>
                        </div>
                        <div class="timer-colon"><span></span><span></span></div>
                        <div class="timer-unit">
                            <button class="unit-btn" data-unit="minutes" data-dir="-1" aria-label="Decrease minutes">&minus;</button>
                            <div class="unit-col">
                                <input class="unit-value" id="minutesInput" type="text" inputmode="numeric" maxlength="2" value="05" aria-label="Minutes">
                                <span class="unit-label">Minutes</span>
                            </div>
                            <button class="unit-btn" data-unit="minutes" data-dir="1" aria-label="Increase minutes">+</button>
                        </div>
                        <div class="timer-colon"><span></span><span></span></div>
                        <div class="timer-unit">
                            <button class="unit-btn" data-unit="seconds" data-dir="-1" aria-label="Decrease seconds">&minus;</button>
                            <div class="unit-col">
                                <input class="unit-value" id="secondsInput" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Seconds">
                                <span class="unit-label">Seconds</span>
                            </div>
                            <button class="unit-btn" data-unit="seconds" data-dir="1" aria-label="Increase seconds">+</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="timer-actions">
                <button class="timer-icon-btn reset" id="timerResetBtnNew" aria-label="Reset timer">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                </button>
                <button class="timer-icon-btn play" id="timerPlayBtn" aria-label="Start timer">
                    <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                </button>
            </div>
        </div>

        <div class="controls" id="controls">
            <div class="left-controls">
                <button class="tasks-btn" id="todoToggleBtn" title="To-Do List">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    <span>Tasks</span>
                </button>
            </div>
            <button class="settings-btn" id="settingsBtn" title="Settings">&#9881;</button>
        </div>

        <div class="mode-controls" id="modeControls">
            <button class="mode-btn active" data-mode="clock">Clock</button>
            <button class="mode-btn" data-mode="timer">Timer</button>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-btn" id="closeBtn">&times;</button>
            </div>
            <div class="settings-section">
                <h3>Font</h3>
                <div class="select-group">
                    <select id="fontSelect">
                        <option value="font-inter">Inter</option>
                        <option value="font-helvetica">Helvetica</option>
                        <option value="font-orbitron">Orbitron</option>
                        <option value="font-roboto-mono">Roboto Mono</option>
                        <option value="font-space-mono">Space Mono</option>
                        <option value="font-playfair">Playfair Display</option>
                        <option value="font-poppins">Poppins</option>
                        <option value="font-montserrat">Montserrat</option>
                        <option value="font-raleway">Raleway</option>
                        <option value="font-lora">Lora</option>
                    </select>
                </div>
            </div>
            <div class="settings-section">
                <h3>Time Format</h3>
                <div class="toggle-group">
                    <button class="toggle on" id="formatToggle"></button>
                    <span class="toggle-label" id="formatLabel">24-Hour</span>
                </div>
                <div class="toggle-group">
                    <button class="toggle on" id="secondsToggle"></button>
                    <span class="toggle-label">Show Seconds</span>
                </div>
            </div>
        </div>

        <div class="todo-panel" id="todoPanel">
            <div class="todo-header">
                <h2>Tasks</h2>
                <button class="todo-close-btn" id="todoCloseBtn">&times;</button>
            </div>
            <div class="todo-body">
                <div class="todo-section" id="todoMainSection"></div>
            </div>
            <div class="todo-footer">
                <div class="todo-progress-row">
                    <span class="todo-progress-text" id="todoProgressText">0 of 0 tasks completed</span>
                    <span class="todo-progress-pct" id="todoProgressPct">0%</span>
                </div>
                <div class="todo-progress-track">
                    <div class="todo-progress-fill" id="todoProgressFill" style="width: 0%;"></div>
                </div>
                <div class="add-task-row" id="addTaskRow">
                    <input type="text" class="add-task-input" id="newTaskInput" placeholder="Add a task..." maxlength="120">
                    <button class="add-task-btn" id="addTaskBtn" title="Add task">+</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentMode = 'clock';
        let is24Hour = true;
        let showSeconds = true;
        let tasks = [];
        let nextTaskId = 1;
        let draggedTaskId = null;

        // Clock State
        let clockInterval;

        // Timer State
        let timerDuration = 300;
        let timerRemaining = 300;
        let timerRunning = false;
        let timerInterval = null;

        // DOM elements
        const body = bodyElement = document.body;
        const clockDisplay = document.getElementById('clockDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const timeElement = document.getElementById('time');
        const dateElement = document.getElementById('date');
        const controls = document.getElementById('controls');
        const modeControls = document.getElementById('modeControls');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeBtn = document.getElementById('closeBtn');
        const fontSelect = document.getElementById('fontSelect');
        const formatToggle = document.getElementById('formatToggle');
        const formatLabel = document.getElementById('formatLabel');
        const secondsToggle = document.getElementById('secondsToggle');

        // To-Do DOM
        const todoPanel = document.getElementById('todoPanel');
        const todoToggleBtn = document.getElementById('todoToggleBtn');
        const todoCloseBtn = document.getElementById('todoCloseBtn');
        const todoMainSection = document.getElementById('todoMainSection');
        const todoProgressText = document.getElementById('todoProgressText');
        const todoProgressPct = document.getElementById('todoProgressPct');
        const todoProgressFill = document.getElementById('todoProgressFill');
        const newTaskInput = document.getElementById('newTaskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');

        // Timer DOM
        const hoursInput = document.getElementById('hoursInput');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const timerPlayBtn = document.getElementById('timerPlayBtn');
        const timerResetBtn = document.getElementById('timerResetBtnNew');
        const playIcon = document.getElementById('playIcon');
        const ringProgress = document.getElementById('ringProgress');

        const RADIUS = 140;
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

        function init() {
            if (ringProgress) {
                ringProgress.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;
                ringProgress.style.strokeDashoffset = '0';
            }

            loadSettings();
            loadTasks();
            setupEventListeners();
            startClock();
            updateTimerDisplay();
        }

        // Clock functions
        function startClock() {
            updateClock();
            clockInterval = setInterval(updateClock, 1000);
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            if (!is24Hour) {
                hours = hours % 12 || 12;
            }
            hours = String(hours).padStart(2, '0');

            timeElement.textContent = showSeconds ? `${hours}:${minutes}:${seconds}` : `${hours}:${minutes}`;

            const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
            dateElement.textContent = now.toLocaleDateString('en-US', options);
        }

        // Timer functions
        function updateTimerDisplay() {
            const h = Math.floor(timerRemaining / 3600);
            const m = Math.floor((timerRemaining % 3600) / 60);
            const s = timerRemaining % 60;

            if (!timerRunning) {
                hoursInput.value = String(h).padStart(2, '0');
                minutesInput.value = String(m).padStart(2, '0');
                secondsInput.value = String(s).padStart(2, '0');
            } else {
                hoursInput.value = String(h).padStart(2, '0');
                minutesInput.value = String(m).padStart(2, '0');
                secondsInput.value = String(s).padStart(2, '0');
            }

            if (ringProgress && timerDuration > 0) {
                const fraction = timerRemaining / timerDuration;
                const offset = CIRCUMFERENCE - fraction * CIRCUMFERENCE;
                ringProgress.style.strokeDashoffset = offset;
            }
        }

        function toggleTimer() {
            if (timerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!timerRunning) {
                if (timerRemaining <= 0) {
                    const h = parseInt(hoursInput.value, 10) || 0;
                    const m = parseInt(minutesInput.value, 10) || 0;
                    const s = parseInt(secondsInput.value, 10) || 0;
                    timerDuration = h * 3600 + m * 60 + s;
                    timerRemaining = timerDuration;
                }
                if (timerRemaining > 0) {
                    timerRunning = true;
                    playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                    timerInterval = setInterval(() => {
                        if (timerRemaining > 0) {
                            timerRemaining--;
                            updateTimerDisplay();
                        } else {
                            pauseTimer();
                        }
                    }, 1000);
                }
            }
        }

        function pauseTimer() {
            timerRunning = false;
            clearInterval(timerInterval);
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }

        function resetTimer() {
            pauseTimer();
            const h = parseInt(hoursInput.value, 10) || 0;
            const m = parseInt(minutesInput.value, 10) || 0;
            const s = parseInt(secondsInput.value, 10) || 0;
            timerDuration = h * 3600 + m * 60 + s;
            timerRemaining = timerDuration;
            updateTimerDisplay();
        }

        // To-Do List Functions
        function loadTasks() {
            const saved = localStorage.getItem('todo_tasks');
            if (saved) {
                try {
                    tasks = JSON.parse(saved);
                    nextTaskId = tasks.reduce((max, t) => Math.max(max, t.id), 0) + 1;
                } catch(e) { tasks = []; }
            }
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('todo_tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            todoMainSection.innerHTML = '';

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card' + (task.completed ? ' completed' : '');
                card.draggable = true;
                card.dataset.id = task.id;

                card.innerHTML = `
                    <button class="task-checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                    <div class="task-info">
                        <div class="task-name">${escapeHtml(task.name)}</div>
                    </div>
                    <div class="task-drag-handle" title="Drag to reorder">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </div>
                    <button class="task-delete-btn" onclick="deleteTask(${task.id})" title="Delete task">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                `;

                attachDragListeners(card);
                todoMainSection.appendChild(card);
            });

            updateProgress();
        }

        // Drag & Drop Implementation
        function attachDragListeners(card) {
            card.addEventListener('dragstart', (e) => {
                draggedTaskId = Number(card.dataset.id);
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', draggedTaskId);
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                document.querySelectorAll('.task-card').forEach(c => c.classList.remove('drag-over'));
                draggedTaskId = null;
            });

            card.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const targetId = Number(card.dataset.id);
                if (targetId !== draggedTaskId) {
                    card.classList.add('drag-over');
                }
            });

            card.addEventListener('dragleave', () => {
                card.classList.remove('drag-over');
            });

            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('drag-over');
                const targetTaskId = Number(card.dataset.id);

                if (draggedTaskId === null || draggedTaskId === targetTaskId) return;

                const fromIndex = tasks.findIndex(t => t.id === draggedTaskId);
                const toIndex = tasks.findIndex(t => t.id === targetTaskId);

                if (fromIndex !== -1 && toIndex !== -1) {
                    const [movedTask] = tasks.splice(fromIndex, 1);
                    tasks.splice(toIndex, 0, movedTask);

                    saveTasks();
                    renderTasks();
                }
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function addTask() {
            const text = newTaskInput.value.trim();
            if (!text) return;
            tasks.push({ id: nextTaskId++, name: text, completed: false });
            newTaskInput.value = '';
            saveTasks();
            renderTasks();
        }

        window.toggleTask = function(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        };

        window.deleteTask = function(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        };

        function updateProgress() {
            const total = tasks.length;
            const done = tasks.filter(t => t.completed).length;
            const pct = total ? Math.round((done / total) * 100) : 0;
            todoProgressText.textContent = `${done} of ${total} tasks completed`;
            todoProgressPct.textContent = `${pct}%`;
            todoProgressFill.style.width = `${pct}%`;
        }

        // Event listeners & controls
        function setupEventListeners() {
            document.addEventListener('mousemove', () => {
                controls.classList.add('visible');
                modeControls.classList.remove('dimmed');
                clearTimeout(window.controlsTimeout);
                window.controlsTimeout = setTimeout(() => {
                    if (!settingsPanel.classList.contains('open') && !todoPanel.classList.contains('open')) {
                        controls.classList.remove('visible');
                        modeControls.classList.add('dimmed');
                    }
                }, 3000);
            });

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                    if (currentMode === 'clock') {
                        clockDisplay.style.display = 'block';
                        timerDisplay.classList.remove('active');
                    } else {
                        clockDisplay.style.display = 'none';
                        timerDisplay.classList.add('active');
                    }
                });
            });

            settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
            closeBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));

            todoToggleBtn.addEventListener('click', () => todoPanel.classList.add('open'));
            todoCloseBtn.addEventListener('click', () => todoPanel.classList.remove('open'));

            addTaskBtn.addEventListener('click', addTask);
            newTaskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });

            timerPlayBtn.addEventListener('click', toggleTimer);
            timerResetBtn.addEventListener('click', resetTimer);

            fontSelect.addEventListener('change', (e) => {
                body.className = body.className.replace(/font-\S+/g, '');
                body.classList.add(e.target.value);
                localStorage.setItem('font_choice', e.target.value);
            });

            formatToggle.addEventListener('click', () => {
                is24Hour = !is24Hour;
                formatToggle.classList.toggle('on', is24Hour);
                formatLabel.textContent = is24Hour ? '24-Hour' : '12-Hour';
                updateClock();
            });

            secondsToggle.addEventListener('click', () => {
                showSeconds = !showSeconds;
                secondsToggle.classList.toggle('on', showSeconds);
                updateClock();
            });
        }

        function loadSettings() {
            const savedFont = localStorage.getItem('font_choice');
            if (savedFont) {
                fontSelect.value = savedFont;
                body.classList.add(savedFont);
            }
        }

        // Start
        init();
    </script>
</body>
</html>
