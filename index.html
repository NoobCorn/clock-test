<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock & Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=Raleway:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #ffffff;
            --gradient-1: #0f0f1e;
            --gradient-2: #1a1a3e;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: all 0.3s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        body.gradient-on {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            animation: gradientShift 15s ease infinite;
        }

        body.gradient-diagonal {
            background: linear-gradient(45deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        body.gradient-radial {
            background: radial-gradient(circle, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(10deg); }
        }

        body.gradient-movement-off {
            animation: none !important;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Clock Display */
        .clock-display {
            text-align: center;
            z-index: 10;
        }

        .time {
            font-size: 12vw;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
            margin: 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .date {
            font-size: 1.5vw;
            color: var(--text-secondary);
            margin-top: 2vw;
            letter-spacing: 0.05em;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        /* Radial Timer Display */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .circle-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg {
            stroke: rgba(255, 255, 255, 0.15);
        }

        .ring-progress {
            stroke: var(--accent);
            stroke-dasharray: 578; /* 2 * PI * 92 */
            stroke-dashoffset: 0;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        .timer-digits {
            display: flex;
            align-items: center;
            font-size: 3.5rem;
            font-weight: 300;
            color: var(--text-primary);
            z-index: 2;
            font-variant-numeric: tabular-nums;
        }

        .timer-digits input {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            width: 2ch;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
        }

        .timer-digits input::-webkit-outer-spin-button,
        .timer-digits input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .timer-digits input:focus {
            border-bottom-color: var(--accent);
        }

        .times-up-msg {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Controls & Navigation */
        .controls {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            width: 100%;
            padding: 3vmin;
            display: flex;
            justify-content: flex-end;
            z-index: 50;
        }

        .settings-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .mode-controls {
            position: fixed;
            bottom: 3vmin;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
        }

        .mode-btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* Settings Panel */
        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
            padding: 24px;
        }

        .settings-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .settings-header h2 {
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .settings-section {
            margin-bottom: 32px;
        }

        .settings-section h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .settings-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .theme-preview {
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        .theme-preview:hover {
            transform: scale(1.02);
        }

        .theme-preview.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .mode-content {
            display: none;
        }

        .mode-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .time { font-size: 18vw; }
            .date { font-size: 4vw; }
            .circle-wrapper { width: 260px; height: 260px; }
            .timer-digits { font-size: 2.8rem; }
        }

        /* Themes */
        .theme-midnight { background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%); }
        .theme-ocean { background: linear-gradient(135deg, #001a33 0%, #004466 100%); }
        .theme-aurora { background: linear-gradient(135deg, #0a3a52 0%, #16e0bd 100%); }
        .theme-sunset { background: linear-gradient(135deg, #ff6b35 0%, #ffa500 100%); }
        .theme-purple-space { background: linear-gradient(135deg, #2d1b69 0%, #8f39fc 100%); }
        .theme-snow { background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%); }
        .theme-forest { background: linear-gradient(135deg, #1b4332 0%, #52b788 100%); }
        .theme-ember { background: linear-gradient(135deg, #6a040f 0%, #ff006e 100%); }
        .theme-gold { background: linear-gradient(135deg, #8b7500 0%, #ffd700 100%); }
        .theme-monochrome { background: linear-gradient(135deg, #000000 0%, #ffffff 100%); }
    </style>
</head>
<body>
    <div class="container">
        <div class="clock-display" id="clockDisplay">
            <p class="time" id="time">00:00:00</p>
            <p class="date" id="date"></p>
        </div>

        <div class="timer-container" id="timerDisplay" style="display: none;">
            <div class="circle-wrapper">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <circle class="ring-bg" cx="100" cy="100" r="92" fill="none" stroke-width="4" />
                    <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="92" fill="none" stroke-width="4" />
                </svg>
                <div class="timer-digits" id="timerDigits">
                    <input type="number" id="tHours" min="0" max="99" value="00">:
                    <input type="number" id="tMinutes" min="0" max="59" value="05">:
                    <input type="number" id="tSeconds" min="0" max="59" value="00">
                </div>
            </div>
            <div id="timesUpMsg" class="times-up-msg" style="display: none;">Time's up!</div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="settings-btn" id="settingsBtn">⚙️</button>
    </div>

    <div class="mode-controls" id="modeControls">
        <button class="mode-btn active" data-mode="clock">Clock</button>
        <button class="mode-btn" data-mode="timer">Timer</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="close-btn" id="closeSettings">&times;</button>
        </div>

        <div class="settings-section">
            <h3>Theme</h3>
            <div class="settings-group" id="themeGroup"></div>
        </div>

        <div class="settings-section mode-content" id="timerSettings">
            <h3>Timer Controls</h3>
            <div class="button-group">
                <button class="btn primary" id="timerStart">Start</button>
                <button class="btn" id="timerPause">Pause</button>
                <button class="btn" id="timerReset">Reset</button>
            </div>
        </div>
    </div>

    <script>
        const THEMES = [
            { name: 'Midnight', class: 'theme-midnight', textColor: '#ffffff', bg: '#0f0f1e' },
            { name: 'Ocean', class: 'theme-ocean', textColor: '#ffffff', bg: '#001a33' },
            { name: 'Aurora', class: 'theme-aurora', textColor: '#ffffff', bg: '#0a3a52' },
            { name: 'Sunset', class: 'theme-sunset', textColor: '#000000', bg: '#ff6b35' },
            { name: 'Purple Space', class: 'theme-purple-space', textColor: '#ffffff', bg: '#2d1b69' },
            { name: 'Snow', class: 'theme-snow', textColor: '#000000', bg: '#f5f5f5' },
            { name: 'Forest', class: 'theme-forest', textColor: '#ffffff', bg: '#1b4332' },
            { name: 'Ember', class: 'theme-ember', textColor: '#ffffff', bg: '#6a040f' },
            { name: 'Gold', class: 'theme-gold', textColor: '#000000', bg: '#8b7500' },
            { name: 'Monochrome', class: 'theme-monochrome', textColor: '#ffffff', bg: '#000000' }
        ];

        // Timer State
        const timerState = {
            running: false,
            remaining: null,
            totalSet: 300,
            targetTime: 0,
            rafId: null
        };

        // DOM Elements
        const clockDisplay = document.getElementById('clockDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const timeDisplay = document.getElementById('time');
        const dateDisplay = document.getElementById('date');
        
        const inputH = document.getElementById('tHours');
        const inputM = document.getElementById('tMinutes');
        const inputS = document.getElementById('tSeconds');
        const ringProgress = document.getElementById('ringProgress');
        const timesUpMsg = document.getElementById('timesUpMsg');

        const timerStartBtn = document.getElementById('timerStart');
        const timerPauseBtn = document.getElementById('timerPause');
        const timerResetBtn = document.getElementById('timerReset');

        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettings = document.getElementById('closeSettings');
        const settingsPanel = document.getElementById('settingsPanel');
        const themeGroup = document.getElementById('themeGroup');
        const timerSettings = document.getElementById('timerSettings');

        const CIRCUMFERENCE = 2 * Math.PI * 92; // ~578
        const pad = (n) => n.toString().padStart(2, '0');

        // --- Clock Logic ---
        function updateClock() {
            const now = new Date();
            timeDisplay.textContent = now.toLocaleTimeString();
            dateDisplay.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Timer Logic ---
        function updateInputsReadOnly(isReadOnly) {
            inputH.readOnly = isReadOnly;
            inputM.readOnly = isReadOnly;
            inputS.readOnly = isReadOnly;
        }

        function calculateTotalSet() {
            const h = parseInt(inputH.value, 10) || 0;
            const m = parseInt(inputM.value, 10) || 0;
            const s = parseInt(inputS.value, 10) || 0;
            return h * 3600 + m * 60 + s;
        }

        function updateTimerDisplay(secondsRemaining) {
            const total = secondsRemaining !== null ? secondsRemaining : timerState.totalSet;
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = Math.floor(total % 60);

            inputH.value = pad(h);
            inputM.value = pad(m);
            inputS.value = pad(s);

            if (timerState.totalSet > 0 && secondsRemaining !== null) {
                const progress = 1 - secondsRemaining / timerState.totalSet;
                const offset = CIRCUMFERENCE * progress;
                ringProgress.style.strokeDashoffset = offset;
            } else {
                ringProgress.style.strokeDashoffset = 0;
            }
        }

        function tick() {
            const diff = timerState.targetTime - Date.now();

            if (diff <= 0) {
                timerState.remaining = 0;
                timerState.running = false;
                updateTimerDisplay(0);
                timesUpMsg.style.display = 'block';
                cancelAnimationFrame(timerState.rafId);
                updateInputsReadOnly(false);
                return;
            }

            timerState.remaining = diff / 1000;
            updateTimerDisplay(timerState.remaining);
            timerState.rafId = requestAnimationFrame(tick);
        }

        function startTimer() {
            if (timerState.running) return;

            if (timerState.remaining === null || timerState.remaining <= 0) {
                timerState.totalSet = calculateTotalSet();
                if (timerState.totalSet <= 0) return;
                timerState.remaining = timerState.totalSet;
            }

            timesUpMsg.style.display = 'none';
            timerState.targetTime = Date.now() + timerState.remaining * 1000;
            timerState.running = true;
            updateInputsReadOnly(true);
            timerState.rafId = requestAnimationFrame(tick);
        }

        function pauseTimer() {
            if (!timerState.running) return;
            timerState.running = false;
            cancelAnimationFrame(timerState.rafId);
            updateInputsReadOnly(false);
        }

        function resetTimer() {
            timerState.running = false;
            cancelAnimationFrame(timerState.rafId);
            timerState.remaining = null;
            timesUpMsg.style.display = 'none';
            updateInputsReadOnly(false);
            timerState.totalSet = calculateTotalSet();
            updateTimerDisplay(null);
        }

        timerStartBtn.addEventListener('click', startTimer);
        timerPauseBtn.addEventListener('click', pauseTimer);
        timerResetBtn.addEventListener('click', resetTimer);

        [inputH, inputM, inputS].forEach(input => {
            input.addEventListener('change', () => {
                if (!timerState.running) {
                    timerState.totalSet = calculateTotalSet();
                }
            });
        });

        // --- Mode Selector Handler ---
        document.querySelectorAll('.mode-btn').forEach((btn) => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach((b) => b.classList.remove('active'));
                e.target.classList.add('active');

                const mode = e.target.dataset.mode;
                if (mode === 'timer') {
                    clockDisplay.style.display = 'none';
                    timerDisplay.style.display = 'flex';
                    timerSettings.classList.add('active');
                } else {
                    clockDisplay.style.display = 'block';
                    timerDisplay.style.display = 'none';
                    timerSettings.classList.remove('active');
                }
            });
        });

        // --- Settings & Themes ---
        settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
        closeSettings.addEventListener('click', () => settingsPanel.classList.remove('open'));

        THEMES.forEach((theme) => {
            const btn = document.createElement('div');
            btn.className = `theme-preview ${theme.class}`;
            btn.textContent = theme.name;
            btn.style.color = theme.textColor;
            btn.addEventListener('click', () => {
                document.body.className = theme.class;
                document.documentElement.style.setProperty('--text-primary', theme.textColor);
                document.documentElement.style.setProperty('--accent', theme.textColor);
                document.querySelectorAll('.theme-preview').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
            });
            themeGroup.appendChild(btn);
        });
    </script>
</body>
</html>
