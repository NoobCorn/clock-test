<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #ffffff;
            --gradient-1: #ffffff;
            --gradient-2: #ffffff;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: all 0.3s ease;
            background: var(--bg-primary);
        }

        body.gradient-on {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            animation: gradientShift 15s ease infinite;
        }

        body.gradient-diagonal {
            background: linear-gradient(45deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        body.gradient-radial {
            background: radial-gradient(circle, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(10deg); }
        }

        body.gradient-movement-off {
            animation: none !important;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .clock-display {
            text-align: center;
            z-index: 10;
        }

        .time {
            font-size: 12vw;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
            margin: 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .date {
            font-size: 1.5vw;
            color: var(--text-secondary);
            margin-top: 2vw;
            letter-spacing: 0.05em;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .controls {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 3vmin;
            z-index: 50;
            pointer-events: none;
        }

        .settings-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease, opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .controls.visible .settings-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .mode-controls {
            position: fixed;
            bottom: 3vmin;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
        }

        .mode-btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* On-screen Timer / Stopwatch panels (live on the main tab, not in settings) */
        .timer-panel,
        .stopwatch-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 3vw;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            max-width: 92vw;
        }

        .timer-panel.active,
        .stopwatch-panel.active {
            display: flex;
        }

        .timer-panel.visible,
        .stopwatch-panel.visible {
            opacity: 1;
            pointer-events: all;
        }

        .stepper-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .adjust-mode-toggle {
            display: flex;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .adjust-mode-btn {
            padding: 8px 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .adjust-mode-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .timer-chip {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }

        .timer-chip:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .alarm-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alarm-row .select-label {
            margin: 0;
            white-space: nowrap;
        }

        .alarm-select {
            width: auto;
            min-width: 160px;
        }

        .ctrl-btn {
            padding: 10px 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .ctrl-btn.primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
            padding: 24px;
        }

        .settings-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .settings-header h2 {
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .settings-section {
            margin-bottom: 32px;
        }

        .settings-section h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .settings-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .theme-preview {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .theme-preview:hover {
            transform: scale(1.05);
        }

        .theme-preview.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .font-preview {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 14px;
            text-align: center;
        }

        .font-preview:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .font-preview.active {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            border: none;
            padding: 0;
        }

        .toggle.on {
            background: var(--accent);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s ease;
        }

        .toggle.on::after {
            left: 24px;
        }

        .toggle-label {
            color: var(--text-primary);
            font-size: 14px;
        }

        .select-group {
            margin-bottom: 12px;
        }

        .select-label {
            display: block;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        select, input[type="color"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="color"] {
            padding: 6px;
            height: 44px;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.2);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .color-swatch {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0;
            cursor: pointer;
            background: none;
            overflow: hidden;
        }

        .color-swatch::-webkit-color-swatch-wrapper {
            padding: 0;
            border-radius: 8px;
        }

        .color-swatch::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
        }

        .color-swatch::-moz-color-swatch {
            border: none;
            border-radius: 8px;
        }

        .color-row-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .color-row-info .select-label {
            margin: 0;
        }

        .color-hex {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .gradient-options {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .gradient-option {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .gradient-option.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .mode-content {
            display: none;
        }

        .mode-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .settings-panel {
                max-width: 100%;
            }

            .time {
                font-size: 18vw;
            }

            .date {
                font-size: 4vw;
            }

            .settings-group {
                grid-template-columns: 1fr;
            }

            .mode-btn {
                padding: 8px 16px;
                font-size: 12px;
            }

            .stepper-row {
                max-width: 100%;
            }

            .alarm-row {
                flex-direction: column;
                gap: 6px;
            }
        }

        /* Themes */
        .theme-midnight { background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%); color: #ffffff; }
        .theme-ocean { background: linear-gradient(135deg, #001a33 0%, #004466 100%); color: #ffffff; }
        .theme-aurora { background: linear-gradient(135deg, #0a3a52 0%, #16e0bd 100%); color: #ffffff; }
        .theme-sunset { background: linear-gradient(135deg, #ff6b35 0%, #ffa500 100%); color: #000000; }
        .theme-purple-space { background: linear-gradient(135deg, #2d1b69 0%, #8f39fc 100%); color: #ffffff; }
        .theme-snow { background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%); color: #000000; }
        .theme-forest { background: linear-gradient(135deg, #1b4332 0%, #52b788 100%); color: #ffffff; }
        .theme-ember { background: linear-gradient(135deg, #6a040f 0%, #ff006e 100%); color: #ffffff; }
        .theme-gold { background: linear-gradient(135deg, #8b7500 0%, #ffd700 100%); color: #000000; }
        .theme-monochrome { background: linear-gradient(135deg, #000000 0%, #ffffff 100%); color: #ffffff; }

        /* Font Styles */
        .font-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .font-helvetica { font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif; }
        .font-orbitron { font-family: 'Orbitron', monospace; }
        .font-roboto-mono { font-family: 'Roboto Mono', monospace; }
        .font-space-mono { font-family: 'Space Mono', monospace; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-raleway { font-family: 'Raleway', sans-serif; }
        .font-lora { font-family: 'Lora', serif; }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=Raleway:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="clock-display" id="clockDisplay">
            <p class="time" id="time">00:00:00</p>
            <p class="date" id="date"></p>
        </div>

        <!-- Timer panel: lives on the main screen, not in settings -->
        <div class="timer-panel" id="timerPanel">
            <div class="stepper-row">
                <div class="adjust-mode-toggle" id="adjustModeToggle">
                    <button class="adjust-mode-btn active" data-adjust-mode="add">+</button>
                    <button class="adjust-mode-btn" data-adjust-mode="subtract">−</button>
                </div>
                <div class="stepper-row" id="timerSteppers" style="gap: 8px;"></div>
            </div>
            <div class="action-row">
                <button class="ctrl-btn primary" id="timerStartBtn">Start</button>
                <button class="ctrl-btn" id="timerPauseBtn">Pause</button>
                <button class="ctrl-btn" id="timerResetBtn">Reset</button>
            </div>
            <div class="alarm-row">
                <label class="select-label">Alarm Sound</label>
                <select id="alarmSoundSelect" class="alarm-select">
                    <option value="beep">Classic Beep</option>
                    <option value="digital">Digital Alarm</option>
                    <option value="chime">Gentle Chime</option>
                    <option value="bell">Bell</option>
                </select>
                <button class="ctrl-btn" id="alarmTestBtn">🔊 Test</button>
            </div>
        </div>

        <!-- Stopwatch panel: lives on the main screen, not in settings -->
        <div class="stopwatch-panel" id="stopwatchPanel">
            <div class="action-row">
                <button class="ctrl-btn primary" id="stopwatchStartBtn">Start</button>
                <button class="ctrl-btn" id="stopwatchStopBtn">Stop</button>
                <button class="ctrl-btn" id="stopwatchResetBtn">Reset</button>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="settings-btn" id="settingsBtn">⚙️</button>
        <div></div>
    </div>

    <div class="mode-controls" id="modeControls">
        <button class="mode-btn active" data-mode="clock">Clock</button>
        <button class="mode-btn" data-mode="timer">Timer</button>
        <button class="mode-btn" data-mode="stopwatch">Stopwatch</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="close-btn" id="closeSettings">&times;</button>
        </div>

        <!-- Themes -->
        <div class="settings-section">
            <h3>Preset Themes</h3>
            <div class="settings-group" id="themeGroup">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Custom Colors -->
        <div class="settings-section">
            <h3>Custom Colors</h3>

            <div class="color-row">
                <input type="color" id="customBgColor" class="color-swatch">
                <div class="color-row-info">
                    <label class="select-label">Background color</label>
                    <span class="color-hex" id="customBgColorHex">#000000</span>
                </div>
            </div>

            <div class="color-row">
                <input type="color" id="customGradientColor" class="color-swatch">
                <div class="color-row-info">
                    <label class="select-label">Secondary / background gradient color</label>
                    <span class="color-hex" id="customGradientColorHex">#000000</span>
                </div>
            </div>

            <div class="color-row">
                <input type="color" id="customTextColor" class="color-swatch">
                <div class="color-row-info">
                    <label class="select-label">Text color</label>
                    <span class="color-hex" id="customTextColorHex">#000000</span>
                </div>
            </div>

            <div class="color-row">
                <input type="color" id="customAccentColor" class="color-swatch">
                <div class="color-row-info">
                    <label class="select-label">Accent color</label>
                    <span class="color-hex" id="customAccentColorHex">#000000</span>
                </div>
            </div>

            <button class="ctrl-btn" id="resetColorsBtn" style="width: 100%;">Reset to Theme Colors</button>
        </div>

        <!-- Gradient -->
        <div class="settings-section">
            <h3>Gradient</h3>
            <div class="toggle-group">
                <button class="toggle" id="gradientToggle"></button>
                <label class="toggle-label">Enable Gradient</label>
            </div>
            <div id="gradientOptions" style="display: none;">
                <div class="toggle-group">
                    <button class="toggle" id="gradientMovementToggle"></button>
                    <label class="toggle-label">Animate Gradient</label>
                </div>
                <label class="settings-label" style="display: block; color: var(--text-primary); font-size: 12px; margin-bottom: 8px;">Style</label>
                <div class="gradient-options">
                    <button class="gradient-option active" data-gradient="linear">Linear</button>
                    <button class="gradient-option" data-gradient="diagonal">Diagonal</button>
                    <button class="gradient-option" data-gradient="radial">Radial</button>
                </div>
            </div>
        </div>

        <!-- Font -->
        <div class="settings-section">
            <h3>Font</h3>
            <div class="settings-group" id="fontGroup">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Time Settings -->
        <div class="settings-section">
            <h3>Time</h3>
            <div class="toggle-group">
                <button class="toggle" id="secondsToggle"></button>
                <label class="toggle-label">Show Seconds</label>
            </div>
            <div class="toggle-group">
                <button class="toggle" id="dateToggle"></button>
                <label class="toggle-label">Show Date</label>
            </div>
            <div class="select-group">
                <label class="select-label">Format</label>
                <select id="timeFormatSelect">
                    <option value="12">12 Hour</option>
                    <option value="24">24 Hour</option>
                </select>
            </div>
            <div class="select-group">
                <label class="select-label">Timezone</label>
                <select id="timezoneSelect">
                    <option value="local">Local</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const THEMES = [
            { name: 'Midnight', class: 'theme-midnight', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#0f0f1e', gradient2: '#1a1a3e' },
            { name: 'Ocean', class: 'theme-ocean', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#001a33', gradient2: '#004466' },
            { name: 'Aurora', class: 'theme-aurora', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#0a3a52', gradient2: '#16e0bd' },
            { name: 'Sunset', class: 'theme-sunset', textColor: '#000000', textSecondary: 'rgba(0,0,0,0.6)', gradient1: '#ff6b35', gradient2: '#ffa500' },
            { name: 'Purple Space', class: 'theme-purple-space', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#2d1b69', gradient2: '#8f39fc' },
            { name: 'Snow', class: 'theme-snow', textColor: '#000000', textSecondary: 'rgba(0,0,0,0.6)', gradient1: '#f5f5f5', gradient2: '#ffffff' },
            { name: 'Forest', class: 'theme-forest', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#1b4332', gradient2: '#52b788' },
            { name: 'Ember', class: 'theme-ember', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#6a040f', gradient2: '#ff006e' },
            { name: 'Gold', class: 'theme-gold', textColor: '#000000', textSecondary: 'rgba(0,0,0,0.6)', gradient1: '#8b7500', gradient2: '#ffd700' },
            { name: 'Monochrome', class: 'theme-monochrome', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#000000', gradient2: '#ffffff' }
        ];

        const FONTS = [
            { name: 'Inter', class: 'font-inter' },
            { name: 'Helvetica', class: 'font-helvetica' },
            { name: 'Orbitron', class: 'font-orbitron' },
            { name: 'Roboto Mono', class: 'font-roboto-mono' },
            { name: 'Space Mono', class: 'font-space-mono' },
            { name: 'Playfair', class: 'font-playfair' },
            { name: 'Poppins', class: 'font-poppins' },
            { name: 'Montserrat', class: 'font-montserrat' },
            { name: 'Raleway', class: 'font-raleway' },
            { name: 'Lora', class: 'font-lora' }
        ];

        // State
        const state = {
            mode: 'clock',
            theme: 'Midnight',
            font: 'Inter',
            showSeconds: true,
            showDate: true,
            timeFormat: '12',
            timezone: 'local',
            gradientOn: false,
            gradientMovement: false,
            gradientStyle: 'linear',
            timerRunning: false,
            timerRemaining: 0,
            timerEndTime: 0,
            timerAdjustMode: 'add',
            alarmSound: 'beep',
            stopwatchRunning: false,
            stopwatchTime: 0,
            controlsVisible: false,
            inactivityTimer: null,
            customBgColor: null,
            customGradientColor: null,
            customTextColor: null,
            customAccentColor: null
        };

        // DOM Elements
        const timeDisplay = document.getElementById('time');
        const dateDisplay = document.getElementById('date');
        const clockDisplay = document.getElementById('clockDisplay');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const closeSettings = document.getElementById('closeSettings');
        const controls = document.getElementById('controls');
        const modeControls = document.getElementById('modeControls');
        const timerPanel = document.getElementById('timerPanel');
        const stopwatchPanel = document.getElementById('stopwatchPanel');
        const alarmSoundSelect = document.getElementById('alarmSoundSelect');
        const gradientToggle = document.getElementById('gradientToggle');
        const gradientOptions = document.getElementById('gradientOptions');
        const gradientMovementToggle = document.getElementById('gradientMovementToggle');
        const secondsToggle = document.getElementById('secondsToggle');
        const dateToggle = document.getElementById('dateToggle');
        const timeFormatSelect = document.getElementById('timeFormatSelect');
        const timezoneSelect = document.getElementById('timezoneSelect');
        const customBgColor = document.getElementById('customBgColor');
        const customGradientColor = document.getElementById('customGradientColor');
        const customTextColor = document.getElementById('customTextColor');
        const customAccentColor = document.getElementById('customAccentColor');
        const resetColorsBtn = document.getElementById('resetColorsBtn');

        // Initialize
        function init() {
            loadSettings();
            renderThemes();
            renderFonts();
            renderTimerSteppers();
            renderTimezones();
            setupEventListeners();
            selectMode(state.mode);
            updateClock();
            setInterval(updateClock, 100);
            applySettings();
        }

        function loadSettings() {
            const saved = localStorage.getItem('clockSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                Object.assign(state, settings);
            }
        }

        function saveSettings() {
            const toSave = {
                theme: state.theme,
                font: state.font,
                showSeconds: state.showSeconds,
                showDate: state.showDate,
                timeFormat: state.timeFormat,
                timezone: state.timezone,
                gradientOn: state.gradientOn,
                gradientMovement: state.gradientMovement,
                gradientStyle: state.gradientStyle,
                mode: state.mode,
                alarmSound: state.alarmSound,
                customBgColor: state.customBgColor,
                customGradientColor: state.customGradientColor,
                customTextColor: state.customTextColor,
                customAccentColor: state.customAccentColor
            };
            localStorage.setItem('clockSettings', JSON.stringify(toSave));
        }

        function renderThemes() {
            const group = document.getElementById('themeGroup');
            group.innerHTML = THEMES.map(theme => 
                `<div class="theme-preview ${theme.class} ${state.theme === theme.name ? 'active' : ''}" 
                     data-theme="${theme.name}" 
                     title="${theme.name}">Aa</div>`
            ).join('');
            
            group.querySelectorAll('.theme-preview').forEach(el => {
                el.addEventListener('click', () => selectTheme(el.dataset.theme));
            });
        }

        function renderFonts() {
            const group = document.getElementById('fontGroup');
            group.innerHTML = FONTS.map(font => 
                `<div class="font-preview ${font.class} ${state.font === font.name ? 'active' : ''}" 
                     data-font="${font.name}">
                    ${font.name}
                </div>`
            ).join('');
            
            group.querySelectorAll('.font-preview').forEach(el => {
                el.addEventListener('click', () => selectFont(el.dataset.font));
            });
        }

        const TIMER_STEPS = [
            { label: '1s', seconds: 1 },
            { label: '10s', seconds: 10 },
            { label: '30s', seconds: 30 },
            { label: '1m', seconds: 60 },
            { label: '5m', seconds: 300 },
            { label: '15m', seconds: 900 },
            { label: '30m', seconds: 1800 },
            { label: '1h', seconds: 3600 }
        ];

        function renderTimerSteppers() {
            const container = document.getElementById('timerSteppers');
            container.innerHTML = TIMER_STEPS.map(step => `
                <button class="timer-chip" data-seconds="${step.seconds}">${step.label}</button>
            `).join('');

            container.querySelectorAll('.timer-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const seconds = parseInt(btn.dataset.seconds, 10);
                    const delta = state.timerAdjustMode === 'subtract' ? -seconds : seconds;
                    adjustTimer(delta);
                    showControls();
                });
            });

            document.querySelectorAll('.adjust-mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.timerAdjustMode = btn.dataset.adjustMode;
                    document.querySelectorAll('.adjust-mode-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.adjustMode === state.timerAdjustMode);
                    });
                });
            });
        }

        function adjustTimer(deltaSeconds) {
            if (state.timerRunning) {
                state.timerEndTime += deltaSeconds * 1000;
                const remainingNow = Math.round((state.timerEndTime - Date.now()) / 1000);
                if (remainingNow <= 0) {
                    state.timerRunning = false;
                    state.timerRemaining = 0;
                }
            } else {
                state.timerRemaining = Math.max(0, state.timerRemaining + deltaSeconds);
            }
            updateClock();
        }

        const FALLBACK_TIMEZONES = [
            'UTC', 'Africa/Cairo', 'Africa/Johannesburg', 'Africa/Lagos', 'Africa/Nairobi',
            'America/Anchorage', 'America/Argentina/Buenos_Aires', 'America/Bogota', 'America/Chicago',
            'America/Denver', 'America/Halifax', 'America/Los_Angeles', 'America/Mexico_City',
            'America/New_York', 'America/Phoenix', 'America/Sao_Paulo', 'America/St_Johns',
            'America/Toronto', 'America/Vancouver', 'Asia/Bangkok', 'Asia/Dhaka', 'Asia/Dubai',
            'Asia/Hong_Kong', 'Asia/Istanbul', 'Asia/Jakarta', 'Asia/Jerusalem', 'Asia/Kabul',
            'Asia/Karachi', 'Asia/Kolkata', 'Asia/Kuala_Lumpur', 'Asia/Manila', 'Asia/Riyadh',
            'Asia/Seoul', 'Asia/Shanghai', 'Asia/Singapore', 'Asia/Taipei', 'Asia/Tehran',
            'Asia/Tokyo', 'Atlantic/Reykjavik', 'Australia/Adelaide', 'Australia/Brisbane',
            'Australia/Melbourne', 'Australia/Perth', 'Australia/Sydney', 'Europe/Amsterdam',
            'Europe/Athens', 'Europe/Berlin', 'Europe/Dublin', 'Europe/Helsinki', 'Europe/Lisbon',
            'Europe/London', 'Europe/Madrid', 'Europe/Moscow', 'Europe/Paris', 'Europe/Prague',
            'Europe/Rome', 'Europe/Stockholm', 'Europe/Vienna', 'Europe/Warsaw', 'Europe/Zurich',
            'Pacific/Auckland', 'Pacific/Fiji', 'Pacific/Honolulu'
        ];

        function getAllTimezones() {
            if (typeof Intl.supportedValuesOf === 'function') {
                try {
                    const zones = Intl.supportedValuesOf('timeZone');
                    if (zones && zones.length) return zones;
                } catch (e) { /* fall through to fallback list */ }
            }
            return FALLBACK_TIMEZONES;
        }

        function renderTimezones() {
            const zones = getAllTimezones();
            timezoneSelect.innerHTML = '<option value="local">Local</option>' +
                zones.map(zone => `<option value="${zone}">${zone.replace(/_/g, ' ')}</option>`).join('');
        }

        function selectTheme(themeName) {
            state.theme = themeName;

            // Choosing a preset resets custom overrides, same as picking a new Discord theme
            state.customBgColor = null;
            state.customGradientColor = null;
            state.customTextColor = null;
            state.customAccentColor = null;

            document.querySelectorAll('.theme-preview').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === themeName);
            });

            applySettings();
            saveSettings();
        }

        function selectFont(fontName) {
            state.font = fontName;
            const font = FONTS.find(f => f.name === fontName);
            document.body.classList.remove(...Array.from(document.body.classList).filter(c => c.startsWith('font-')));
            document.body.classList.add(font.class);
            
            document.querySelectorAll('.font-preview').forEach(el => {
                el.classList.toggle('active', el.dataset.font === fontName);
            });
            
            saveSettings();
        }

        function updateCustomColor(colorType, hexColor) {
            // Each custom color is independent — setting one never touches the others,
            // and background color applies whether or not the gradient is on.
            state[colorType] = hexColor;

            document.querySelectorAll('.theme-preview').forEach(el => {
                el.classList.remove('active');
            });

            applySettings();
            saveSettings();
        }

        function hexToRgba(hex, alpha) {
            let h = (hex || '#ffffff').replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const num = parseInt(h, 16);
            const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateColorInputs() {
            const theme = THEMES.find(t => t.name === state.theme) || THEMES[0];
            const bg = state.customBgColor || theme.gradient1;
            const grad = state.customGradientColor || theme.gradient2;
            const text = state.customTextColor || theme.textColor;
            const accent = state.customAccentColor || theme.textColor;

            customBgColor.value = bg;
            customGradientColor.value = grad;
            customTextColor.value = text;
            customAccentColor.value = accent;

            document.getElementById('customBgColorHex').textContent = bg.toUpperCase();
            document.getElementById('customGradientColorHex').textContent = grad.toUpperCase();
            document.getElementById('customTextColorHex').textContent = text.toUpperCase();
            document.getElementById('customAccentColorHex').textContent = accent.toUpperCase();
        }

        function applyThemeBackground() {
            const body = document.body;
            body.classList.remove('gradient-on', 'gradient-diagonal', 'gradient-radial', 'gradient-movement-off');
            
            if (state.gradientOn) {
                body.classList.add('gradient-on', `gradient-${state.gradientStyle}`);
                if (!state.gradientMovement) {
                    body.classList.add('gradient-movement-off');
                }
            }
        }

        function setupEventListeners() {
            // Settings
            settingsBtn.addEventListener('click', () => {
                settingsPanel.classList.add('open');
                showControls();
            });

            closeSettings.addEventListener('click', () => {
                settingsPanel.classList.remove('open');
            });

            // Custom colors
            customBgColor.addEventListener('change', (e) => {
                updateCustomColor('customBgColor', e.target.value);
            });
            customGradientColor.addEventListener('change', (e) => {
                updateCustomColor('customGradientColor', e.target.value);
            });
            customTextColor.addEventListener('change', (e) => {
                updateCustomColor('customTextColor', e.target.value);
            });
            customAccentColor.addEventListener('change', (e) => {
                updateCustomColor('customAccentColor', e.target.value);
            });

            resetColorsBtn.addEventListener('click', () => {
                state.customBgColor = null;
                state.customGradientColor = null;
                state.customTextColor = null;
                state.customAccentColor = null;
                applySettings();
                saveSettings();
            });

            // Gradient
            gradientToggle.addEventListener('click', () => {
                state.gradientOn = !state.gradientOn;
                updateGradientToggle();
                applyThemeBackground();
                saveSettings();
            });

            gradientMovementToggle.addEventListener('click', () => {
                state.gradientMovement = !state.gradientMovement;
                updateGradientMovementToggle();
                applyThemeBackground();
                saveSettings();
            });

            document.querySelectorAll('.gradient-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.gradient-option').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.gradientStyle = btn.dataset.gradient;
                    applyThemeBackground();
                    saveSettings();
                });
            });

            // Time settings
            secondsToggle.addEventListener('click', () => {
                state.showSeconds = !state.showSeconds;
                updateSecondsToggle();
                saveSettings();
            });

            dateToggle.addEventListener('click', () => {
                state.showDate = !state.showDate;
                updateDateToggle();
                saveSettings();
            });

            timeFormatSelect.addEventListener('change', (e) => {
                state.timeFormat = e.target.value;
                saveSettings();
            });

            timezoneSelect.addEventListener('change', (e) => {
                state.timezone = e.target.value;
                saveSettings();
            });

            // Mode controls
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectMode(btn.dataset.mode);
                    showControls();
                });
            });

            // Timer on-tab controls
            document.getElementById('timerStartBtn').addEventListener('click', () => {
                startTimer();
                showControls();
            });
            document.getElementById('timerPauseBtn').addEventListener('click', () => {
                pauseTimer();
                showControls();
            });
            document.getElementById('timerResetBtn').addEventListener('click', () => {
                resetTimer();
                showControls();
            });

            alarmSoundSelect.addEventListener('change', (e) => {
                state.alarmSound = e.target.value;
                saveSettings();
            });

            document.getElementById('alarmTestBtn').addEventListener('click', () => {
                playAlarmSound(state.alarmSound, 1);
            });

            // Stopwatch on-tab controls
            document.getElementById('stopwatchStartBtn').addEventListener('click', () => {
                startStopwatch();
                showControls();
            });
            document.getElementById('stopwatchStopBtn').addEventListener('click', () => {
                pauseStopwatch();
                showControls();
            });
            document.getElementById('stopwatchResetBtn').addEventListener('click', () => {
                resetStopwatch();
                showControls();
            });

            // Mouse activity
            document.addEventListener('mousemove', showControls);
        }

        function selectMode(mode) {
            state.mode = mode;

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // Show the matching on-tab control panel
            timerPanel.classList.toggle('active', mode === 'timer');
            stopwatchPanel.classList.toggle('active', mode === 'stopwatch');

            saveSettings();
        }

        function showControls() {
            controls.classList.add('visible');
            modeControls.classList.add('visible');
            timerPanel.classList.add('visible');
            stopwatchPanel.classList.add('visible');
            clearTimeout(state.inactivityTimer);

            // Only the buttons/controls fade out from inactivity — the time itself always stays fully visible
            state.inactivityTimer = setTimeout(() => {
                controls.classList.remove('visible');
                modeControls.classList.remove('visible');
                timerPanel.classList.remove('visible');
                stopwatchPanel.classList.remove('visible');
            }, 5000);
        }

        function updateGradientToggle() {
            if (state.gradientOn) {
                gradientToggle.classList.add('on');
                gradientOptions.style.display = 'block';
            } else {
                gradientToggle.classList.remove('on');
                gradientOptions.style.display = 'none';
            }
        }

        function updateGradientMovementToggle() {
            if (state.gradientMovement) {
                gradientMovementToggle.classList.add('on');
            } else {
                gradientMovementToggle.classList.remove('on');
            }
        }

        function updateSecondsToggle() {
            if (state.showSeconds) {
                secondsToggle.classList.add('on');
            } else {
                secondsToggle.classList.remove('on');
            }
        }

        function updateDateToggle() {
            if (state.showDate) {
                dateToggle.classList.add('on');
            } else {
                dateToggle.classList.remove('on');
            }
        }

        function applySettings() {
            // Layer: theme provides the defaults, each custom color independently overrides
            // just its own slot. Background color now always applies (--bg-primary is the
            // solid fallback), whether or not the gradient is toggled on.
            const theme = THEMES.find(t => t.name === state.theme) || THEMES[0];

            const bg = state.customBgColor || theme.gradient1;
            const grad = state.customGradientColor || theme.gradient2;
            const text = state.customTextColor || theme.textColor;
            const textSecondary = state.customTextColor ? hexToRgba(state.customTextColor, 0.7) : theme.textSecondary;
            const accent = state.customAccentColor || theme.textColor;

            document.documentElement.style.setProperty('--bg-primary', bg);
            document.documentElement.style.setProperty('--gradient-1', bg);
            document.documentElement.style.setProperty('--gradient-2', grad);
            document.documentElement.style.setProperty('--text-primary', text);
            document.documentElement.style.setProperty('--text-secondary', textSecondary);
            document.documentElement.style.setProperty('--accent', accent);

            // Apply font
            selectFont(state.font);

            // Apply background
            applyThemeBackground();

            // Apply toggles
            updateSecondsToggle();
            updateDateToggle();
            updateGradientToggle();
            updateGradientMovementToggle();

            // Apply selects
            timeFormatSelect.value = state.timeFormat;
            timezoneSelect.value = state.timezone;
            alarmSoundSelect.value = state.alarmSound;
            
            // Apply color inputs
            updateColorInputs();
        }

        function updateClock() {
            if (state.mode === 'clock') {
                displayClock();
            } else if (state.mode === 'timer') {
                displayTimer();
            } else if (state.mode === 'stopwatch') {
                displayStopwatch();
            }
        }

        function displayClock() {
            let now;
            if (state.timezone === 'local') {
                now = new Date();
            } else {
                now = new Date(new Date().toLocaleString('en-US', { timeZone: state.timezone }));
            }

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let timeStr;
            if (state.timeFormat === '12') {
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                if (state.showSeconds) timeStr += `:${String(seconds).padStart(2, '0')}`;
                timeStr += ` ${ampm}`;
            } else {
                timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                if (state.showSeconds) timeStr += `:${String(seconds).padStart(2, '0')}`;
            }

            timeDisplay.textContent = timeStr;
            updateTabTitle(timeStr);

            if (state.showDate) {
                const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                dateDisplay.textContent = dateStr;
            } else {
                dateDisplay.textContent = '';
            }
        }

        function formatDuration(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function displayTimer() {
            let remaining = state.timerRemaining;

            if (state.timerRunning) {
                remaining = Math.round((state.timerEndTime - Date.now()) / 1000);
                if (remaining <= 0) {
                    remaining = 0;
                    state.timerRunning = false;
                    state.timerRemaining = 0;
                    playAlarmSound();
                    document.title = "⏰ Time's up!";
                    showControls();
                } else {
                    state.timerRemaining = remaining;
                }
            }

            const timeStr = formatDuration(remaining);
            timeDisplay.textContent = timeStr;
            dateDisplay.textContent = '';
            if (state.timerRunning) updateTabTitle(`Timer ${timeStr}`);
        }

        function displayStopwatch() {
            const minutes = Math.floor(state.stopwatchTime / 6000);
            const seconds = Math.floor((state.stopwatchTime % 6000) / 100);
            const centiseconds = state.stopwatchTime % 100;
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
            timeDisplay.textContent = timeStr;
            dateDisplay.textContent = '';
            updateTabTitle(timeStr);
        }

        function updateTabTitle(title) {
            document.title = title;
        }

        function startTimer() {
            if (state.timerRemaining <= 0) return;
            state.timerRunning = true;
            state.timerEndTime = Date.now() + state.timerRemaining * 1000;
            updateClock();
        }

        function pauseTimer() {
            if (state.timerRunning) {
                state.timerRemaining = Math.max(0, Math.round((state.timerEndTime - Date.now()) / 1000));
            }
            state.timerRunning = false;
        }

        function resetTimer() {
            state.timerRunning = false;
            state.timerRemaining = 0;
            updateClock();
        }

        function startStopwatch() {
            if (!state.stopwatchRunning) {
                state.stopwatchRunning = true;
                const interval = setInterval(() => {
                    if (state.stopwatchRunning) {
                        state.stopwatchTime++;
                    } else {
                        clearInterval(interval);
                    }
                }, 10);
            }
        }

        function pauseStopwatch() {
            state.stopwatchRunning = false;
        }

        function resetStopwatch() {
            state.stopwatchRunning = false;
            state.stopwatchTime = 0;
            updateClock();
        }

        // --- Alarm sound synthesis (Web Audio API — no external files needed) ---
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function beepTone(ctx, freq, startTime, duration, type, gainVal) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(gainVal, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playAlarmSound(soundType, repeats) {
            const ctx = getAudioCtx();
            const sound = soundType || state.alarmSound;
            const count = repeats || 4;
            const now = ctx.currentTime;

            for (let i = 0; i < count; i++) {
                const t = now + i * 0.9;
                if (sound === 'beep') {
                    beepTone(ctx, 880, t, 0.25, 'square', 0.25);
                } else if (sound === 'digital') {
                    beepTone(ctx, 600, t, 0.12, 'square', 0.25);
                    beepTone(ctx, 900, t + 0.15, 0.12, 'square', 0.25);
                } else if (sound === 'chime') {
                    beepTone(ctx, 1046, t, 0.5, 'sine', 0.25);
                    beepTone(ctx, 1318, t + 0.1, 0.5, 'sine', 0.15);
                } else if (sound === 'bell') {
                    beepTone(ctx, 988, t, 0.6, 'sine', 0.3);
                    beepTone(ctx, 1976, t, 0.6, 'sine', 0.1);
                }
            }
        }

        // Start
        init();
    </script>
