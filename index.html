<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #ffffff;
            --gradient-1: #ffffff;
            --gradient-2: #ffffff;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: all 0.3s ease;
            background: var(--bg-primary);
        }

        body.gradient-on {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            animation: gradientShift 15s ease infinite;
        }

        body.gradient-diagonal {
            background: linear-gradient(45deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        body.gradient-radial {
            background: radial-gradient(circle, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(10deg); }
        }

        body.gradient-movement-off {
            animation: none !important;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .clock-display {
            text-align: center;
            z-index: 10;
        }

        .time {
            font-size: 12vw;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
            margin: 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .date {
            font-size: 1.5vw;
            color: var(--text-secondary);
            margin-top: 2vw;
            letter-spacing: 0.05em;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .controls {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 3vmin;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
        }

        .controls.visible {
            opacity: 1;
        }

        .controls .settings-btn {
            pointer-events: none;
        }

        .controls.visible .settings-btn {
            pointer-events: auto;
        }

        .settings-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .mode-controls {
            position: fixed;
            bottom: 3vmin;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
        }

        .mode-btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
            padding: 24px;
        }

        .settings-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .settings-header h2 {
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .settings-section {
            margin-bottom: 32px;
        }

        .settings-section h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .settings-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .theme-preview {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .theme-preview:hover {
            transform: scale(1.05);
        }

        .theme-preview.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .font-preview {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 14px;
            text-align: center;
        }

        .font-preview:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .font-preview.active {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            border: none;
            padding: 0;
        }

        .toggle.on {
            background: var(--accent);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s ease;
        }

        .toggle.on::after {
            left: 24px;
        }

        .toggle-label {
            color: var(--text-primary);
            font-size: 14px;
        }

        .select-group {
            margin-bottom: 12px;
        }

        .select-label {
            display: block;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.2);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .timer-input {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Timer Display */
        .timer-display {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: clamp(70px, 9vh, 110px);
            z-index: 10;
        }

        .timer-display.active {
            display: flex;
        }

        .timer-ring-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 340px;
            height: 340px;
        }

        .timer-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .ring-bg {
            fill: none;
            stroke: var(--text-secondary);
            opacity: 0.25;
            stroke-width: 2;
        }

        .ring-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear, opacity 0.3s ease;
        }

        .timer-units-col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
        }

        .timer-units {
            display: flex;
            align-items: center;
            gap: clamp(6px, 0.8vw, 14px);
        }

        .timer-unit {
            display: flex;
            align-items: center;
            gap: clamp(2px, 0.3vw, 6px);
        }

        .unit-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 0.6vw, 10px);
        }

        .unit-value {
            font-family: inherit;
            font-size: clamp(40px, 7vw, 84px);
            font-weight: 300;
            color: var(--text-primary);
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 2ch;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            padding: 0;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .unit-value::-webkit-outer-spin-button,
        .unit-value::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .unit-value:focus {
            color: var(--accent);
        }

        .unit-label {
            font-size: clamp(11px, 0.9vw, 14px);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .unit-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: clamp(18px, 1.8vw, 24px);
            cursor: pointer;
            width: clamp(30px, 2.4vw, 40px);
            height: clamp(30px, 2.4vw, 40px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s ease, color 0.2s ease;
            line-height: 1;
            font-family: inherit;
        }

        .unit-btn:hover:not(:disabled) {
            opacity: 1;
            color: var(--text-primary);
        }

        .unit-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
        }

        .timer-colon {
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 0.5vw, 8px);
            padding-bottom: clamp(16px, 1.6vw, 22px);
        }

        .timer-colon span {
            width: clamp(6px, 0.5vw, 8px);
            height: clamp(6px, 0.5vw, 8px);
            border-radius: 50%;
            background: var(--text-primary);
            opacity: 0.8;
        }

        .timer-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: clamp(16px, 3vh, 32px);
            z-index: 10;
        }

        .timer-icon-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s ease, filter 0.2s ease;
        }

        .timer-icon-btn:active {
            transform: scale(0.94);
        }

        .timer-icon-btn.reset {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
        }

        .timer-icon-btn.reset:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .timer-icon-btn.play {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
        }

        .timer-icon-btn.play:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .timer-icon-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .time-input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .time-input-group label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .time-input-group input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            text-align: center;
        }

        .time-input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.15);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .btn.primary:hover {
            opacity: 0.9;
        }

        .gradient-options {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .gradient-option {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .gradient-option.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .mode-content {
            display: none;
        }

        .mode-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .settings-panel {
                max-width: 100%;
            }

            .time {
                font-size: 18vw;
            }

            .date {
                font-size: 4vw;
            }

            .settings-group {
                grid-template-columns: 1fr;
            }

            .mode-btn {
                padding: 8px 16px;
                font-size: 12px;
            }
        }

        /* Themes */
        .theme-midnight { background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%); color: #ffffff; }
        .theme-ocean { background: linear-gradient(135deg, #001a33 0%, #004466 100%); color: #ffffff; }
        .theme-aurora { background: linear-gradient(135deg, #0a3a52 0%, #16e0bd 100%); color: #ffffff; }
        .theme-sunset { background: linear-gradient(135deg, #ff6b35 0%, #ffa500 100%); color: #000000; }
        .theme-purple-space { background: linear-gradient(135deg, #2d1b69 0%, #8f39fc 100%); color: #ffffff; }
        .theme-snow { background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%); color: #000000; }
        .theme-forest { background: linear-gradient(135deg, #1b4332 0%, #52b788 100%); color: #ffffff; }
        .theme-ember { background: linear-gradient(135deg, #6a040f 0%, #ff006e 100%); color: #ffffff; }
        .theme-gold { background: linear-gradient(135deg, #8b7500 0%, #ffd700 100%); color: #000000; }
        .theme-monochrome { background: linear-gradient(135deg, #000000 0%, #ffffff 100%); color: #ffffff; }

        /* Font Styles */
        .font-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .font-helvetica { font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif; }
        .font-orbitron { font-family: 'Orbitron', monospace; }
        .font-roboto-mono { font-family: 'Roboto Mono', monospace; }
        .font-space-mono { font-family: 'Space Mono', monospace; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-raleway { font-family: 'Raleway', sans-serif; }
        .font-lora { font-family: 'Lora', serif; }

        .mode-controls {
            transition: opacity 0.3s ease;
        }

        .mode-controls.dimmed {
            opacity: 0.25;
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=Raleway:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="clock-display" id="clockDisplay">
            <p class="time" id="time">00:00:00</p>
            <p class="date" id="date"></p>
        </div>

        <div class="timer-display" id="timerDisplay">
            <div class="timer-ring-wrap">
                <svg class="timer-ring" viewBox="0 0 300 300">
                    <circle class="ring-bg" cx="150" cy="150" r="140"></circle>
                    <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="140"></circle>
                </svg>
                <div class="timer-units-col">
                    <div class="timer-units">
                        <div class="timer-unit">
                            <button class="unit-btn" data-unit="hours" data-dir="-1" aria-label="Decrease hours">&minus;</button>
                            <div class="unit-col">
                                <input class="unit-value" id="hoursInput" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Hours">
                                <span class="unit-label">Hours</span>
                            </div>
                            <button class="unit-btn" data-unit="hours" data-dir="1" aria-label="Increase hours">+</button>
                        </div>
                        <div class="timer-colon"><span></span><span></span></div>
                        <div class="timer-unit">
                            <button class="unit-btn" data-unit="minutes" data-dir="-1" aria-label="Decrease minutes">&minus;</button>
                            <div class="unit-col">
                                <input class="unit-value" id="minutesInput" type="text" inputmode="numeric" maxlength="2" value="05" aria-label="Minutes">
                                <span class="unit-label">Minutes</span>
                            </div>
                            <button class="unit-btn" data-unit="minutes" data-dir="1" aria-label="Increase minutes">+</button>
                        </div>
                        <div class="timer-colon"><span></span><span></span></div>
                        <div class="timer-unit">
                            <button class="unit-btn" data-unit="seconds" data-dir="-1" aria-label="Decrease seconds">&minus;</button>
                            <div class="unit-col">
                                <input class="unit-value" id="secondsInput" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Seconds">
                                <span class="unit-label">Seconds</span>
                            </div>
                            <button class="unit-btn" data-unit="seconds" data-dir="1" aria-label="Increase seconds">+</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="timer-actions">
                <button class="timer-icon-btn reset" id="timerResetBtnNew" aria-label="Reset timer">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                </button>
                <button class="timer-icon-btn play" id="timerPlayBtn" aria-label="Start timer">
                    <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="settings-btn" id="settingsBtn">⚙️</button>
        <div></div>
    </div>

    <div class="mode-controls" id="modeControls">
        <button class="mode-btn active" data-mode="clock">Clock</button>
        <button class="mode-btn" data-mode="timer">Timer</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="close-btn" id="closeSettings">&times;</button>
        </div>

        <div class="settings-section">
            <h3>Theme</h3>
            <div class="settings-group" id="themeGroup">
                </div>
        </div>

        <div class="settings-section">
            <h3>Gradient</h3>
            <div class="toggle-group">
                <button class="toggle" id="gradientToggle"></button>
                <label class="toggle-label">Enable Gradient</label>
            </div>
            <div id="gradientOptions" style="display: none;">
                <div class="toggle-group">
                    <button class="toggle" id="gradientMovementToggle"></button>
                    <label class="toggle-label">Animate Gradient</label>
                </div>
                <label class="settings-label" style="display: block; color: var(--text-primary); font-size: 12px; margin-bottom: 8px;">Style</label>
                <div class="gradient-options">
                    <button class="gradient-option active" data-gradient="linear">Linear</button>
                    <button class="gradient-option" data-gradient="diagonal">Diagonal</button>
                    <button class="gradient-option" data-gradient="radial">Radial</button>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <h3>Font</h3>
            <div class="settings-group" id="fontGroup">
                </div>
        </div>

        <div class="settings-section">
            <h3>Time</h3>
            <div class="toggle-group">
                <button class="toggle" id="secondsToggle"></button>
                <label class="toggle-label">Show Seconds</label>
            </div>
            <div class="toggle-group">
                <button class="toggle" id="dateToggle"></button>
                <label class="toggle-label">Show Date</label>
            </div>
            <div class="select-group">
                <label class="select-label">Format</label>
                <select id="timeFormatSelect">
                    <option value="12">12 Hour</option>
                    <option value="24">24 Hour</option>
                </select>
            </div>
            <div class="select-group">
                <label class="select-label">Timezone</label>
                <select id="timezoneSelect">
                    <option value="local">Local</option>
                    <option value="America/New_York">New York</option>
                    <option value="Europe/London">London</option>
                    <option value="Europe/Paris">Paris</option>
                    <option value="Asia/Tokyo">Tokyo</option>
                    <option value="Asia/Shanghai">Shanghai</option>
                    <option value="Australia/Sydney">Sydney</option>
                    <option value="Asia/Dubai">Dubai</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const THEMES = [
            { name: 'Midnight', class: 'theme-midnight', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#0f0f1e', gradient2: '#1a1a3e' },
            { name: 'Ocean', class: 'theme-ocean', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#001a33', gradient2: '#004466' },
            { name: 'Aurora', class: 'theme-aurora', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#0a3a52', gradient2: '#16e0bd' },
            { name: 'Sunset', class: 'theme-sunset', textColor: '#000000', textSecondary: 'rgba(0,0,0,0.6)', gradient1: '#ff6b35', gradient2: '#ffa500' },
            { name: 'Purple Space', class: 'theme-purple-space', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#2d1b69', gradient2: '#8f39fc' },
            { name: 'Snow', class: 'theme-snow', textColor: '#000000', textSecondary: 'rgba(0,0,0,0.6)', gradient1: '#f5f5f5', gradient2: '#ffffff' },
            { name: 'Forest', class: 'theme-forest', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#1b4332', gradient2: '#52b788' },
            { name: 'Ember', class: 'theme-ember', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#6a040f', gradient2: '#ff006e' },
            { name: 'Gold', class: 'theme-gold', textColor: '#000000', textSecondary: 'rgba(0,0,0,0.6)', gradient1: '#8b7500', gradient2: '#ffd700' },
            { name: 'Monochrome', class: 'theme-monochrome', textColor: '#ffffff', textSecondary: 'rgba(255,255,255,0.7)', gradient1: '#000000', gradient2: '#ffffff' }
        ];

        const FONTS = [
            { name: 'Inter', class: 'font-inter' },
            { name: 'Helvetica', class: 'font-helvetica' },
            { name: 'Orbitron', class: 'font-orbitron' },
            { name: 'Roboto Mono', class: 'font-roboto-mono' },
            { name: 'Space Mono', class: 'font-space-mono' },
            { name: 'Playfair', class: 'font-playfair' },
            { name: 'Poppins', class: 'font-poppins' },
            { name: 'Montserrat', class: 'font-montserrat' },
            { name: 'Raleway', class: 'font-raleway' },
            { name: 'Lora', class: 'font-lora' }
        ];

        // State
        const state = {
            mode: 'clock',
            theme: 'Midnight',
            font: 'Inter',
            showSeconds: true,
            showDate: true,
            timeFormat: '12',
            timezone: 'local',
            gradientOn: false,
            gradientMovement: false,
            gradientStyle: 'linear',
            timerRunning: false,
            timerTime: 0,
            timerTotal: 0,
            controlsVisible: false,
            inactivityTimer: null
        };

        // DOM Elements
        const timeDisplay = document.getElementById('time');
        const dateDisplay = document.getElementById('date');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const closeSettings = document.getElementById('closeSettings');
        const controls = document.getElementById('controls');
        const modeControls = document.getElementById('modeControls');
        const gradientToggle = document.getElementById('gradientToggle');
        const gradientOptions = document.getElementById('gradientOptions');
        const gradientMovementToggle = document.getElementById('gradientMovementToggle');
        const secondsToggle = document.getElementById('secondsToggle');
        const dateToggle = document.getElementById('dateToggle');
        const timeFormatSelect = document.getElementById('timeFormatSelect');
        const timezoneSelect = document.getElementById('timezoneSelect');
        const clockDisplayEl = document.getElementById('clockDisplay');
        const timerDisplayEl = document.getElementById('timerDisplay');
        const hoursInput = document.getElementById('hoursInput');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const ringProgress = document.getElementById('ringProgress');
        const timerPlayBtn = document.getElementById('timerPlayBtn');
        const timerResetBtnNew = document.getElementById('timerResetBtnNew');
        const playIcon = document.getElementById('playIcon');

        // Initialize
        function init() {
            loadSettings();
            renderThemes();
            renderFonts();
            setupEventListeners();
            updateClock();
            setInterval(updateClock, 100);
            setInterval(tickTimer, 1000);
            applySettings();
            refreshTimerFromInputs();
            selectMode(state.mode);

            requestAnimationFrame(sizeTimerRing);
            window.addEventListener('resize', scheduleSizeTimerRing);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(sizeTimerRing).catch(() => {});
            }
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem('clockSettings');
                if (saved) {
                    const settings = JSON.parse(saved);
                    Object.assign(state, settings);
                }
            } catch (e) {
                // localStorage unavailable (private browsing, sandboxed preview, file:// origin, etc.)
            }
        }

        function saveSettings() {
            try {
                const toSave = {
                    theme: state.theme,
                    font: state.font,
                    showSeconds: state.showSeconds,
                    showDate: state.showDate,
                    timeFormat: state.timeFormat,
                    timezone: state.timezone,
                    gradientOn: state.gradientOn,
                    gradientMovement: state.gradientMovement,
                    gradientStyle: state.gradientStyle,
                    mode: state.mode
                };
                localStorage.setItem('clockSettings', JSON.stringify(toSave));
            } catch (e) {
                // localStorage unavailable - settings just won't persist across reloads
            }
        }

        function renderThemes() {
            const group = document.getElementById('themeGroup');
            group.innerHTML = THEMES.map(theme => 
                `<div class="theme-preview ${theme.class} ${state.theme === theme.name ? 'active' : ''}" 
                     data-theme="${theme.name}" 
                     title="${theme.name}">Aa</div>`
            ).join('');
            
            group.querySelectorAll('.theme-preview').forEach(el => {
                el.addEventListener('click', () => selectTheme(el.dataset.theme));
            });
        }

        function renderFonts() {
            const group = document.getElementById('fontGroup');
            group.innerHTML = FONTS.map(font => 
                `<div class="font-preview ${font.class} ${state.font === font.name ? 'active' : ''}" 
                     data-font="${font.name}">
                    ${font.name}
                </div>`
            ).join('');
            
            group.querySelectorAll('.font-preview').forEach(el => {
                el.addEventListener('click', () => selectFont(el.dataset.font));
            });
        }

        function selectTheme(themeName) {
            state.theme = themeName;
            const theme = THEMES.find(t => t.name === themeName);
            
            document.documentElement.style.setProperty('--bg-primary', theme.gradient1);
            document.documentElement.style.setProperty('--text-primary', theme.textColor);
            document.documentElement.style.setProperty('--text-secondary', theme.textSecondary);
            document.documentElement.style.setProperty('--accent', theme.textColor);
            document.documentElement.style.setProperty('--gradient-1', theme.gradient1);
            document.documentElement.style.setProperty('--gradient-2', theme.gradient2);
            
            document.querySelectorAll('.theme-preview').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === themeName);
            });
            
            applyThemeBackground();
            saveSettings();
        }

        function selectFont(fontName) {
            state.font = fontName;
            const font = FONTS.find(f => f.name === fontName);
            document.body.classList.remove(...Array.from(document.body.classList).filter(c => c.startsWith('font-')));
            document.body.classList.add(font.class);
            
            document.querySelectorAll('.font-preview').forEach(el => {
                el.classList.toggle('active', el.dataset.font === fontName);
            });
            
            saveSettings();
        }

        function applyThemeBackground() {
            const body = document.body;
            body.classList.remove('gradient-on', 'gradient-diagonal', 'gradient-radial', 'gradient-movement-off');
            
            if (state.gradientOn) {
                body.classList.add('gradient-on', `gradient-${state.gradientStyle}`);
                if (!state.gradientMovement) {
                    body.classList.add('gradient-movement-off');
                }
            }
        }

        function setupEventListeners() {
            // Settings
            settingsBtn.addEventListener('click', () => {
                settingsPanel.classList.add('open');
                showControls();
            });

            closeSettings.addEventListener('click', () => {
                settingsPanel.classList.remove('open');
            });

            // Gradient
            gradientToggle.addEventListener('click', () => {
                state.gradientOn = !state.gradientOn;
                updateGradientToggle();
                applyThemeBackground();
                saveSettings();
            });

            gradientMovementToggle.addEventListener('click', () => {
                state.gradientMovement = !state.gradientMovement;
                updateGradientMovementToggle();
                applyThemeBackground();
                saveSettings();
            });

            document.querySelectorAll('.gradient-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.gradient-option').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.gradientStyle = btn.dataset.gradient;
                    applyThemeBackground();
                    saveSettings();
                });
            });

            // Time settings
            secondsToggle.addEventListener('click', () => {
                state.showSeconds = !state.showSeconds;
                updateSecondsToggle();
                saveSettings();
            });

            dateToggle.addEventListener('click', () => {
                state.showDate = !state.showDate;
                updateDateToggle();
                saveSettings();
            });

            timeFormatSelect.addEventListener('change', (e) => {
                state.timeFormat = e.target.value;
                saveSettings();
            });

            timezoneSelect.addEventListener('change', (e) => {
                state.timezone = e.target.value;
                saveSettings();
            });

            // Mode controls
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectMode(btn.dataset.mode);
                    showControls();
                });
            });

            // Timer
            timerPlayBtn.addEventListener('click', toggleTimer);
            timerResetBtnNew.addEventListener('click', resetTimerNew);

            document.querySelectorAll('.unit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    adjustTimerUnit(btn.dataset.unit, parseInt(btn.dataset.dir, 10));
                });
            });

            [hoursInput, minutesInput, secondsInput].forEach(input => {
                input.addEventListener('focus', () => input.select());

                input.addEventListener('input', () => {
                    input.value = input.value.replace(/\D/g, '').slice(0, 2);
                });

                input.addEventListener('change', () => {
                    refreshTimerFromInputs();
                });

                input.addEventListener('blur', () => {
                    refreshTimerFromInputs();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') input.blur();
                });
            });

            // Mouse activity
            document.addEventListener('mousemove', showControls);
            document.addEventListener('click', (e) => {
                if (!settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) {
                    // Clicked outside settings
                }
            });
        }

        function selectMode(mode) {
            state.mode = mode;
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            document.querySelectorAll('.mode-content').forEach(el => {
                el.classList.remove('active');
            });

            clockDisplayEl.style.display = mode === 'timer' ? 'none' : '';
            timerDisplayEl.classList.toggle('active', mode === 'timer');

            if (mode === 'timer') {
                requestAnimationFrame(sizeTimerRing);
            }

            saveSettings();
        }

        function showControls() {
            controls.classList.add('visible');
            modeControls.classList.remove('dimmed');
            clearTimeout(state.inactivityTimer);

            state.inactivityTimer = setTimeout(() => {
                controls.classList.remove('visible');
                modeControls.classList.add('dimmed');
            }, 5000);
        }

        function updateGradientToggle() {
            if (state.gradientOn) {
                gradientToggle.classList.add('on');
                gradientOptions.style.display = 'block';
            } else {
                gradientToggle.classList.remove('on');
                gradientOptions.style.display = 'none';
            }
        }

        function updateGradientMovementToggle() {
            if (state.gradientMovement) {
                gradientMovementToggle.classList.add('on');
            } else {
                gradientMovementToggle.classList.remove('on');
            }
        }

        function updateSecondsToggle() {
            if (state.showSeconds) {
                secondsToggle.classList.add('on');
            } else {
                secondsToggle.classList.remove('on');
            }
        }

        function updateDateToggle() {
            if (state.showDate) {
                dateToggle.classList.add('on');
            } else {
                dateToggle.classList.remove('on');
            }
        }

        function applySettings() {
            // Apply theme
            selectTheme(state.theme);

            // Apply font
            selectFont(state.font);

            // Apply background
            applyThemeBackground();

            // Apply toggles
            updateSecondsToggle();
            updateDateToggle();
            updateGradientToggle();
            updateGradientMovementToggle();

            // Apply selects
            timeFormatSelect.value = state.timeFormat;
            timezoneSelect.value = state.timezone;
        }

        function updateClock() {
            if (state.mode === 'clock') {
                displayClock();
            }
        }

        function displayClock() {
            let now;
            if (state.timezone === 'local') {
                now = new Date();
            } else {
                now = new Date(new Date().toLocaleString('en-US', { timeZone: state.timezone }));
            }

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let timeStr;
            if (state.timeFormat === '12') {
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                if (state.showSeconds) timeStr += `:${String(seconds).padStart(2, '0')}`;
                timeStr += ` ${ampm}`;
            } else {
                timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                if (state.showSeconds) timeStr += `:${String(seconds).padStart(2, '0')}`;
            }

            timeDisplay.textContent = timeStr;
            updateTabTitle(timeStr);

            if (state.showDate) {
                const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                dateDisplay.textContent = dateStr;
            } else {
                dateDisplay.textContent = '';
            }
        }

        const RING_RADIUS = 140;
        const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

        function sizeTimerRing() {
            const col = document.querySelector('.timer-units-col');
            const wrap = document.querySelector('.timer-ring-wrap');
            if (!col || !wrap) return;
            const rect = col.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            const diagonal = Math.sqrt(rect.width * rect.width + rect.height * rect.height);
            const padding = 55;
            let diameter = diagonal + padding;
            const maxAllowed = Math.min(window.innerWidth * 0.75, window.innerHeight * 0.62);
            diameter = Math.min(diameter, maxAllowed, 440);
            diameter = Math.max(diameter, 220);
            wrap.style.width = diameter + 'px';
            wrap.style.height = diameter + 'px';
        }

        let ringResizeTimeout = null;
        function scheduleSizeTimerRing() {
            clearTimeout(ringResizeTimeout);
            ringResizeTimeout = setTimeout(sizeTimerRing, 100);
        }

        function clampUnit(value, min, max) {
            value = parseInt(value, 10);
            if (isNaN(value)) value = 0;
            return Math.min(max, Math.max(min, value));
        }

        function getUnitValues() {
            return {
                hours: clampUnit(hoursInput.value, 0, 99),
                minutes: clampUnit(minutesInput.value, 0, 59),
                seconds: clampUnit(secondsInput.value, 0, 59)
            };
        }

        function setUnitValues(h, m, s) {
            hoursInput.value = String(h).padStart(2, '0');
            minutesInput.value = String(m).padStart(2, '0');
            secondsInput.value = String(s).padStart(2, '0');
        }

        function refreshTimerFromInputs() {
            const u = getUnitValues();
            setUnitValues(u.hours, u.minutes, u.seconds);
            state.timerTotal = u.hours * 3600 + u.minutes * 60 + u.seconds;
            state.timerTime = state.timerTotal;
            updateRing();
        }

        function adjustTimerUnit(unit, dir) {
            if (state.timerRunning) return;
            const u = getUnitValues();
            if (unit === 'hours') u.hours = clampUnit(u.hours + dir, 0, 99);
            if (unit === 'minutes') u.minutes = clampUnit(u.minutes + dir, 0, 59);
            if (unit === 'seconds') u.seconds = clampUnit(u.seconds + dir, 0, 59);
            setUnitValues(u.hours, u.minutes, u.seconds);
            refreshTimerFromInputs();
        }

        function updateRing() {
            ringProgress.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
            if (!state.timerTotal) {
                ringProgress.style.opacity = 0;
                ringProgress.style.strokeDashoffset = `${RING_CIRCUMFERENCE}`;
                return;
            }
            const remainingFraction = Math.max(0, state.timerTime / state.timerTotal);
            ringProgress.style.opacity = 1;
            ringProgress.style.strokeDashoffset = `${RING_CIRCUMFERENCE * (1 - remainingFraction)}`;
        }

        function setTimerControlsDisabled(disabled) {
            [hoursInput, minutesInput, secondsInput].forEach(el => { el.disabled = disabled; });
            document.querySelectorAll('.unit-btn').forEach(btn => { btn.disabled = disabled; });
        }

        function setPlayIcon(playing) {
            playIcon.innerHTML = playing
                ? '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>'
                : '<path d="M8 5v14l11-7z"></path>';
            timerPlayBtn.setAttribute('aria-label', playing ? 'Pause timer' : 'Start timer');
        }

        function toggleTimer() {
            if (state.timerRunning) {
                pauseTimerNew();
            } else {
                startTimerNew();
            }
        }

        function startTimerNew() {
            if (state.timerTime <= 0) {
                refreshTimerFromInputs();
            }
            if (state.timerTime <= 0) return;
            state.timerRunning = true;
            setPlayIcon(true);
            setTimerControlsDisabled(true);
        }

        function pauseTimerNew() {
            state.timerRunning = false;
            setPlayIcon(false);
            setTimerControlsDisabled(false);
        }

        function resetTimerNew() {
            state.timerRunning = false;
            setPlayIcon(false);
            setTimerControlsDisabled(false);
            setUnitValues(0, 5, 0);
            refreshTimerFromInputs();
            updateTabTitle('Clock');
        }

        function tickTimer() {
            if (state.mode !== 'timer' || !state.timerRunning) return;
            state.timerTime--;
            if (state.timerTime <= 0) {
                state.timerTime = 0;
                pauseTimerNew();
                document.title = '✓ Timer Complete';
            } else {
                const h = Math.floor(state.timerTime / 3600);
                const m = Math.floor((state.timerTime % 3600) / 60);
                const s = state.timerTime % 60;
                updateTabTitle(`Timer ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
            }
            const h = Math.floor(state.timerTime / 3600);
            const m = Math.floor((state.timerTime % 3600) / 60);
            const s = state.timerTime % 60;
            setUnitValues(h, m, s);
            updateRing();
        }

        function updateTabTitle(title) {
            document.title = title;
        }

        // Start
        init();
    </script>
</body>
</html>
